<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบหญ้า แชมพูสมุนไพร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f3d2b;--m:#dcebdd;--bg:#f6faf4;--a:#e0a030;--t:#1c2a21}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai Looped',sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
.hero{background:var(--g);color:#fff;padding:64px 20px 72px;text-align:center}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);margin:0 0 12px;font-weight:800}
.hero p{max-width:34rem;margin:0 auto 24px;color:#cfe3d3}
.btn{display:inline-block;background:var(--a);color:#1c1c1c;border:0;padding:12px 28px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
main{max-width:920px;margin:0 auto;padding:40px 20px}
h2{font-size:1.6rem;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:#fff;border:2px solid var(--m);border-radius:20px;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--m)}
.card div{padding:16px 18px 20px}
.card h3{margin:0 0 4px}
.price{font-weight:800;font-size:1.4rem;color:var(--g)}
.sub{font-size:.9rem;color:#4b5f52;margin:0 0 10px}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty input{width:70px}
form{background:#fff;border:2px solid var(--m);border-radius:20px;padding:22px;margin-top:40px;display:grid;gap:14px}
label{font-weight:600;display:grid;gap:4px}
input,textarea{font:inherit;padding:10px 12px;border:2px solid var(--m);border-radius:10px;width:100%}
#sum{font-weight:600}
#slip{display:none;white-space:pre-wrap;background:var(--m);border-radius:14px;padding:16px;margin-top:8px}
footer{text-align:center;padding:30px;color:#4b5f52;font-size:.9rem}
</style>
</head>
<body>
<section class="hero">
  <h1>ใบหญ้า แชมพูสมุนไพร</h1>
  <p>สกัดจากใบหญ้าและสมุนไพรไทย ช่วยให้หนังศีรษะสะอาด ผมนุ่ม สบายตลอดวัน</p>
  <a class="btn" href="#order">สั่งซื้อเลย</a>
</section>

<main>
  <h2>เลือกสูตรของคุณ</h2>
  <div class="grid" id="products"></div>

  <form id="order" onsubmit="return makeSlip(event)">
    <h2>กรอกข้อมูลจัดส่ง</h2>
    <label>ชื่อผู้รับ<input id="name" required></label>
    <label>เบอร์โทร<input id="tel" type="tel" required></label>
    <label>ที่อยู่จัดส่ง<textarea id="addr" rows="3" required></textarea></label>
    <div id="sum">ยอดรวม 0 บาท</div>
    <button class="btn" type="submit">สร้างใบแพ็คสินค้า</button>
    <div id="slip" aria-live="polite"></div>
  </form>
</main>
<footer>ใบหญ้า · ส่งฟรีเมื่อซื้อครบ 500 บาท</footer>

<script>
// ข้อมูลตรงกับ Google Sheet (products.csv)
const P=[
 {sku:"SH001",name:"แชมพูสูตรแก้ผมร่วง",price:259,stock:50,loc:"A1",desc:"ขวด 250 มล. บำรุงรากผมให้แข็งแรง"},
 {sku:"SH002",name:"แชมพูสูตรขจัดรังแค",price:239,stock:40,loc:"A2",desc:"ขวด 250 มล. ลดคันและรังแคตั้งแต่ครั้งแรก"}
];
const fb="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#dcebdd"/><rect x="38" y="30" width="24" height="52" rx="6" fill="#1f3d2b"/><rect x="44" y="18" width="12" height="14" fill="#e0a030"/></svg>');
const box=document.getElementById("products");
P.forEach(p=>{
 box.insertAdjacentHTML("beforeend",`<article class="card">
  <img src="images/${p.sku}.jpg" alt="${p.name}" onerror="this.onerror=null;this.src='${fb}'">
  <div><h3>${p.name}</h3><p class="sub">${p.desc}</p>
  <span class="price">${p.price} บาท</span>
  <label class="qty">จำนวน <input type="number" min="0" max="${p.stock}" value="0" data-sku="${p.sku}"></label></div></article>`);
});
function items(){return [...document.querySelectorAll("[data-sku]")].map(i=>({p:P.find(x=>x.sku===i.dataset.sku),q:+i.value})).filter(x=>x.q>0)}
function total(){return items().reduce((s,x)=>s+x.p.price*x.q,0)}
document.addEventListener("input",()=>{document.getElementById("sum").textContent="ยอดรวม "+total()+" บาท"});
function makeSlip(e){
 e.preventDefault();
 const it=items(),s=document.getElementById("slip");
 if(!it.length){alert("กรุณาเลือกสินค้าอย่างน้อย 1 รายการ");return false}
 s.style.display="block";
 s.textContent="ใบแพ็คสินค้า\nผู้รับ: "+name.value+" โทร "+tel.value+"\nที่อยู่: "+addr.value+"\n\n"+
  it.map(x=>`[${x.p.loc}] ${x.p.sku} ${x.p.name} x${x.q} = ${x.p.price*x.q} บาท`).join("\n")+"\n\nรวม "+total()+" บาท";
 return false;
}
</script>
</body>
</html>
